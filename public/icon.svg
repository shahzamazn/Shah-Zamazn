<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d14"/>
      <stop offset="50%" stop-color="#141724"/>
      <stop offset="100%" stop-color="#08090e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="ruby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with padding for safe zone -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="96" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Cinema Reel / Glow Backdrop -->
  <circle cx="256" cy="230" r="140" fill="url(#ruby)" opacity="0.15" filter="url(#glow)"/>

  <!-- Play / Cinema Film Emblem -->
  <g transform="translate(136, 110)">
    <!-- Film Reel Frame -->
    <rect x="20" y="20" width="200" height="150" rx="24" fill="#181c28" stroke="url(#gold)" stroke-width="8"/>
    <!-- Sprocket holes -->
    <rect x="36" y="32" width="24" height="20" rx="4" fill="url(#gold)"/>
    <rect x="76" y="32" width="24" height="20" rx="4" fill="url(#gold)"/>
    <rect x="116" y="32" width="24" height="20" rx="4" fill="url(#gold)"/>
    <rect x="156" y="32" width="24" height="20" rx="4" fill="url(#gold)"/>
    <rect x="196" y="32" width="10" height="20" rx="2" fill="url(#gold)"/>

    <rect x="36" y="138" width="24" height="20" rx="4" fill="url(#gold)"/>
    <rect x="76" y="138" width="24" height="20" rx="4" fill="url(#gold)"/>
    <rect x="116" y="138" width="24" height="20" rx="4" fill="url(#gold)"/>
    <rect x="156" y="138" width="24" height="20" rx="4" fill="url(#gold)"/>
    <rect x="196" y="138" width="10" height="20" rx="2" fill="url(#gold)"/>

    <!-- Play Triangle Center -->
    <polygon points="105,70 155,95 105,120" fill="url(#gold)"/>
  </g>

  <!-- Typography Brand Base -->
  <text x="256" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="2">SHAHZAMAN</text>
  <text x="256" y="405" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="20" fill="#f59e0b" letter-spacing="4">CINEMA &amp; DRAMAS</text>
</svg>
